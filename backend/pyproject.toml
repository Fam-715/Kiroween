[project]
name = "cursed-cassette-backend"
version = "0.1.0"
description = "Cursed Cassette API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
